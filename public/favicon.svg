<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="reactorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="35%" stop-color="#00b4d8" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#0077b6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#080b11" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="50%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="28" fill="#080b11" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Ambient Glow -->
  <circle cx="64" cy="64" r="54" fill="url(#reactorGlow)" />

  <!-- Outer Segmented Ring -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="16 8" stroke-linecap="round" filter="url(#neonBlur)" opacity="0.9" />

  <!-- Outer Tech Notches (8 directions) -->
  <g stroke="#00f0ff" stroke-width="2" stroke-linecap="round" opacity="0.75">
    <line x1="64" y1="12" x2="64" y2="19" />
    <line x1="64" y1="109" x2="64" y2="116" />
    <line x1="12" y1="64" x2="19" y2="64" />
    <line x1="109" y1="64" x2="116" y2="64" />
    <line x1="27" y1="27" x2="33" y2="33" />
    <line x1="95" y1="95" x2="101" y2="101" />
    <line x1="101" y1="27" x2="95" y2="33" />
    <line x1="27" y1="101" x2="33" y2="95" />
  </g>

  <!-- Middle Gold Energy Ring -->
  <circle cx="64" cy="64" r="36" fill="none" stroke="url(#goldRing)" stroke-width="3" stroke-dasharray="22 10" />

  <!-- Triangular Arc Coils (10 radial coils) -->
  <g transform="translate(64, 64)">
    <rect x="-3" y="-34" width="6" height="9" rx="1.5" fill="#00f0ff" />
    <rect x="-3" y="-34" width="6" height="9" rx="1.5" fill="#00f0ff" transform="rotate(36)" />
    <rect x="-3" y="-34" width="6" height="9" rx="1.5" fill="#00f0ff" transform="rotate(72)" />
    <rect x="-3" y="-34" width="6" height="9" rx="1.5" fill="#00f0ff" transform="rotate(108)" />
    <rect x="-3" y="-34" width="6" height="9" rx="1.5" fill="#00f0ff" transform="rotate(144)" />
    <rect x="-3" y="-34" width="6" height="9" rx="1.5" fill="#00f0ff" transform="rotate(180)" />
    <rect x="-3" y="-34" width="6" height="9" rx="1.5" fill="#00f0ff" transform="rotate(216)" />
    <rect x="-3" y="-34" width="6" height="9" rx="1.5" fill="#00f0ff" transform="rotate(252)" />
    <rect x="-3" y="-34" width="6" height="9" rx="1.5" fill="#00f0ff" transform="rotate(288)" />
    <rect x="-3" y="-34" width="6" height="9" rx="1.5" fill="#00f0ff" transform="rotate(324)" />
  </g>

  <!-- Inner High-Velocity Core Ring -->
  <circle cx="64" cy="64" r="22" fill="#050a14" stroke="#00f0ff" stroke-width="2.5" />

  <!-- Center Core Fusion Star -->
  <polygon points="64,46 69,59 82,64 69,69 64,82 59,69 46,64 59,59" fill="#ffffff" filter="url(#neonBlur)" />
  <circle cx="64" cy="64" r="5" fill="#00f0ff" />
  <circle cx="64" cy="64" r="2.5" fill="#ffffff" />
</svg>